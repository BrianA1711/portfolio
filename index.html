<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BJ's CS Portfolio — Design Showcase</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts for all 4 Distinct Portfolio Aesthetics -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ==========================================================================
       BASE & SHOWCASE TRANSITION STYLES
       ========================================================================== */
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .sample-stage-enter {
      animation: fadeSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardPop {
      from {
        opacity: 0;
        transform: scale(0.97) translateY(6px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .card-animate {
      animation: cardPop 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ==========================================================================
       SAMPLE 1: CYBER TERMINAL STYLES
       ========================================================================== */
    .theme-cyber {
      background-color: #090d16;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      background-image:
        linear-gradient(to right, rgba(34, 211, 238, 0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34, 211, 238, 0.045) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .terminal-cursor {
      display: inline-block;
      width: 10px;
      height: 1.15em;
      background-color: #10b981;
      vertical-align: text-bottom;
      margin-left: 4px;
      animation: cursorBlink 1s infinite;
    }

    .cyber-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(34, 211, 238, 0.22);
      transition: all 0.25s ease;
    }

    .cyber-card:hover {
      border-color: #22d3ee;
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.16), inset 0 0 12px rgba(16, 185, 129, 0.06);
      transform: translateY(-3px);
    }

    /* ==========================================================================
       SAMPLE 2: MODERN BENTO STYLES
       ========================================================================== */
    .theme-bento {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .bento-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.03);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bento-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 32px -8px rgba(15, 23, 42, 0.1), 0 4px 10px -2px rgba(15, 23, 42, 0.04);
      border-color: #cbd5e1;
    }

    /* ==========================================================================
       SAMPLE 3: SWISS BRUTALIST STYLES
       ========================================================================== */
    .theme-brutalist {
      background-color: #f4f1ea;
      color: #111111;
      font-family: 'Space Grotesk', sans-serif;
    }

    .brutalist-box {
      background-color: #ffffff;
      border: 2px solid #111111;
      box-shadow: 5px 5px 0px #111111;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .brutalist-box:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px #111111;
    }

    .brutalist-btn {
      border: 2px solid #111111;
      box-shadow: 3px 3px 0px #111111;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
    }

    .brutalist-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #111111;
    }

    .brutalist-btn:active,
    .brutalist-btn-active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #111111;
    }

    /* ==========================================================================
       SAMPLE 4: COSMIC GLASS STYLES
       ========================================================================== */
    .theme-cosmic {
      background-color: #070514;
      color: #f8fafc;
      font-family: 'Outfit', sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes auroraFloatOne {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(35px, -25px) scale(1.08); }
    }

    @keyframes auroraFloatTwo {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-30px, 30px) scale(1.1); }
    }

    .cosmic-orb-1 {
      animation: auroraFloatOne 12s ease-in-out infinite;
    }

    .cosmic-orb-2 {
      animation: auroraFloatTwo 15s ease-in-out infinite;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.045);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: all 0.28s ease;
    }

    .glass-panel:hover {
      background: rgba(255, 255, 255, 0.075);
      border-color: rgba(192, 132, 252, 0.45);
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(124, 58, 237, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    /* Custom Scrollbar for Code Modal */
    .code-scroll::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .code-scroll::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .code-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    .code-scroll::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-slate-950">

  <!-- ========================================================================
       TOP SHOWCASE TOOLBAR (Unobtrusive switcher & code exporter)
       ======================================================================== -->
  <header
    id="showcase-toolbar"
    class="sticky top-0 z-50 w-full bg-slate-950/95 backdrop-blur-md border-b border-slate-800 text-slate-100 shadow-lg"
  >
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-2.5">
      <!-- Label + 4 Sample Selector Tabs -->
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 mr-1 flex items-center gap-1.5">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Choose a Portfolio Style:
        </span>

        <nav aria-label="Portfolio Style Samples" class="flex flex-wrap items-center gap-1.5" id="sample-tabs">
          <button
            type="button"
            data-sample="cyber"
            class="sample-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all cursor-pointer bg-cyan-500 text-slate-950 font-semibold shadow-sm"
          >
            Sample 1: Cyber Terminal
          </button>
          <button
            type="button"
            data-sample="bento"
            class="sample-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all cursor-pointer bg-slate-900 text-slate-300 hover:bg-slate-800 hover:text-white border border-slate-800"
          >
            Sample 2: Modern Bento
          </button>
          <button
            type="button"
            data-sample="brutalist"
            class="sample-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all cursor-pointer bg-slate-900 text-slate-300 hover:bg-slate-800 hover:text-white border border-slate-800"
          >
            Sample 3: Swiss Brutalist
          </button>
          <button
            type="button"
            data-sample="cosmic"
            class="sample-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all cursor-pointer bg-slate-900 text-slate-300 hover:bg-slate-800 hover:text-white border border-slate-800"
          >
            Sample 4: Cosmic Glass
          </button>
        </nav>
      </div>

      <!-- Copy Standalone HTML Action Button -->
      <button
        type="button"
        id="open-code-modal-btn"
        class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition-all shadow-sm flex items-center gap-1.5 cursor-pointer shrink-0"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
        </svg>
        Copy Standalone HTML
      </button>
    </div>
  </header>

  <!-- ========================================================================
       LIVE PORTFOLIO PREVIEW STAGE
       ======================================================================== -->
  <main id="portfolio-stage" class="min-h-screen w-full transition-colors duration-300"></main>

  <!-- ========================================================================
       STANDALONE HTML CODE EXPORT MODAL
       ======================================================================== -->
  <div
    id="code-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-6 bg-slate-950/80 backdrop-blur-sm"
  >
    <div
      class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden text-slate-100"
    >
      <!-- Modal Header -->
      <div class="px-5 py-4 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3 bg-slate-950/60">
        <div>
          <h2 id="modal-title" class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
            <span>Standalone HTML Code</span>
            <span
              id="modal-sample-badge"
              class="text-xs font-medium px-2.5 py-0.5 rounded-full bg-cyan-500/15 text-cyan-300 border border-cyan-500/30"
            >
              Sample 1: Cyber Terminal
            </span>
          </h2>
          <p class="text-xs text-slate-400 mt-0.5">
            Complete single-file code without the top switcher bar. Save as <code class="text-emerald-400">index.html</code> next to <code class="text-emerald-400">root-sim1.html</code>.
          </p>
        </div>

        <div class="flex items-center gap-2">
          <button
            type="button"
            id="copy-code-btn"
            class="px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition-all flex items-center gap-1.5 cursor-pointer shadow-sm"
          >
            <svg id="copy-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copy-btn-text">Copy Code</span>
          </button>

          <button
            type="button"
            id="close-modal-btn"
            aria-label="Close modal"
            class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-colors cursor-pointer"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Helpful Instruction Banner -->
      <div class="px-5 py-2.5 bg-cyan-950/40 border-b border-cyan-900/50 text-xs text-cyan-200 flex items-center gap-2">
        <svg class="w-4 h-4 text-cyan-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>
          Look for the <strong class="text-white">HOW TO ADD A NEW PROJECT</strong> comments inside the code below whenever you build a new simulation, site, or game!
        </span>
      </div>

      <!-- Code Output Area -->
      <div class="p-4 flex-1 overflow-hidden flex flex-col bg-slate-950">
        <textarea
          id="standalone-code-output"
          readonly
          spellcheck="false"
          class="w-full h-96 sm:h-[460px] bg-slate-950 text-emerald-300 font-mono-code text-xs leading-relaxed p-4 rounded-xl border border-slate-800 focus:outline-none focus:border-cyan-500 resize-none code-scroll"
        ></textarea>
      </div>
    </div>
  </div>

  <!-- ========================================================================
       APPLICATION LOGIC & 4 PORTFOLIO TEMPLATES
       ======================================================================== -->
  <script>
    (function () {
      'use strict';

      /* ----------------------------------------------------------------------
         SHARED PORTFOLIO PROJECT DATA
         - Featured Real Project: Simulation #1 -> root-sim1.html
         - 3 Clearly Marked Template Placeholders for Sites, Games, and Other
         ---------------------------------------------------------------------- */
      const PORTFOLIO_PROJECTS = [
        {
          id: 'sim-1',
          number: '01',
          title: 'Simulation #1',
          category: 'Sims',
          categoryLabel: 'Sims',
          description: 'My first interactive computer science simulation.',
          url: 'root-sim1.html',
          isPlaceholder: false,
          techTag: 'HTML5 / JS Simulation',
          fileName: 'root-sim1.html'
        },
        {
          id: 'site-1',
          number: '02',
          title: 'Web Project #1 (Placeholder)',
          category: 'Sites',
          categoryLabel: 'Sites',
          description: 'Ready-to-customize template card for an upcoming responsive website or web application.',
          url: '#',
          isPlaceholder: true,
          techTag: 'Web Development',
          fileName: 'coming-soon.html'
        },
        {
          id: 'game-1',
          number: '03',
          title: 'Game Project #1 (Placeholder)',
          category: 'Games',
          categoryLabel: 'Games',
          description: 'Ready-to-customize template card for an upcoming interactive browser game or physics demo.',
          url: '#',
          isPlaceholder: true,
          techTag: 'Interactive Game',
          fileName: 'coming-soon.html'
        },
        {
          id: 'other-1',
          number: '04',
          title: 'CS Experiment #1 (Placeholder)',
          category: 'Other',
          categoryLabel: 'Other',
          description: 'Ready-to-customize template card for algorithms, data visualizations, or creative coding.',
          url: '#',
          isPlaceholder: true,
          techTag: 'CS Lab / Experiment',
          fileName: 'coming-soon.html'
        }
      ];

      const CATEGORIES = [
        { id: 'All', label: 'All' },
        { id: 'Sims', label: 'Sims (Simulations)' },
        { id: 'Sites', label: 'Sites (Websites)' },
        { id: 'Games', label: 'Games' },
        { id: 'Other', label: 'Other' }
      ];

      const SAMPLE_META = {
        cyber: {
          name: 'Sample 1: Cyber Terminal',
          shortName: 'Cyber Terminal'
        },
        bento: {
          name: 'Sample 2: Modern Bento',
          shortName: 'Modern Bento'
        },
        brutalist: {
          name: 'Sample 3: Swiss Brutalist',
          shortName: 'Swiss Brutalist'
        },
        cosmic: {
          name: 'Sample 4: Cosmic Glass',
          shortName: 'Cosmic Glass'
        }
      };

      /* Application State */
      let activeSample = 'cyber';
      let activeCategory = 'All';

      /* DOM Elements */
      const stageEl = document.getElementById('portfolio-stage');
      const tabBtns = document.querySelectorAll('.sample-tab-btn');
      const openModalBtn = document.getElementById('open-code-modal-btn');
      const codeModal = document.getElementById('code-modal');
      const closeModalBtn = document.getElementById('close-modal-btn');
      const modalSampleBadge = document.getElementById('modal-sample-badge');
      const codeOutput = document.getElementById('standalone-code-output');
      const copyCodeBtn = document.getElementById('copy-code-btn');
      const copyBtnText = document.getElementById('copy-btn-text');

      /* ----------------------------------------------------------------------
         SVG CATEGORY ICONS (Clean inline vector icons per category)
         ---------------------------------------------------------------------- */
      function getCategorySVG(category, className = 'w-6 h-6') {
        switch (category) {
          case 'Sims':
            return `<svg class="${className}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23-.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5" />
            </svg>`;
          case 'Sites':
            return `<svg class="${className}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418" />
            </svg>`;
          case 'Games':
            return `<svg class="${className}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.25 6.087c0-.355.186-.676.401-.959.221-.29.349-.634.349-1.003 0-1.036-1.007-1.875-2.25-1.875s-2.25.84-2.25 1.875c0 .369.128.713.349 1.003.215.283.401.604.401.959v0a.64.64 0 01-.657.643 48.39 48.39 0 01-4.163-.3c.186 1.613.293 3.25.315 4.907a.656.656 0 01-.658.663v0c-.355 0-.676-.186-.959-.401a1.647 1.647 0 00-1.003-.349c-1.036 0-1.875 1.007-1.875 2.25s.84 2.25 1.875 2.25c.369 0 .713-.128 1.003-.349.283-.215.604-.401.959-.401v0c.31 0 .555.26.532.57a48.039 48.039 0 01-.642 5.056c1.518.19 3.058.309 4.616.354a.64.64 0 00.657-.643v0c0-.355-.186-.676-.401-.959a1.647 1.647 0 01-.349-1.003c0-1.035 1.008-1.875 2.25-1.875 1.243 0 2.25.84 2.25 1.875 0 .369-.128.713-.349 1.003-.215.283-.4.604-.4.959v0c0 .333.277.599.61.58a48.1 48.1 0 005.427-.63 48.05 48.05 0 00.582-4.717.532.532 0 00-.533-.57v0c-.355 0-.676.186-.959.401-.29.221-.634.349-1.003.349-1.035 0-1.875-1.007-1.875-2.25s.84-2.25 1.875-2.25c.37 0 .713.128 1.003.349.283.215.604.401.96.401v0a.656.656 0 00.658-.663 48.422 48.422 0 00-.37-5.36c-1.886.342-3.81.574-5.766.689a.578.578 0 01-.61-.58v0z" />
            </svg>`;
          default:
            return `<svg class="${className}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
            </svg>`;
        }
      }

      /* ----------------------------------------------------------------------
         SAMPLE 1 RENDERER: CYBER TERMINAL
         ---------------------------------------------------------------------- */
      function renderCyberSample(filteredProjects) {
        const filterButtonsHTML = CATEGORIES.map((cat) => {
          const isActive = activeCategory === cat.id;
          return `
            <button
              type="button"
              data-filter="${cat.id}"
              class="filter-btn font-mono-code text-xs sm:text-sm px-4 py-2.5 rounded-lg border transition-all cursor-pointer ${
                isActive
                  ? 'bg-cyan-400/15 border-cyan-400 text-cyan-300 shadow-[0_0_16px_rgba(34,211,238,0.28)] font-semibold'
                  : 'bg-slate-900/80 border-slate-800 text-slate-400 hover:border-cyan-500/50 hover:text-cyan-200'
              }"
            >
              <span class="text-emerald-400 mr-1">${isActive ? '>' : '$'}</span>${cat.label}
            </button>
          `;
        }).join('');

        const cardsHTML = filteredProjects
          .map((proj) => {
            return `
              <article class="cyber-card rounded-xl p-6 flex flex-col justify-between card-animate relative overflow-hidden">
                <div>
                  <!-- Card Top Terminal Header -->
                  <div class="flex items-center justify-between gap-2 pb-4 mb-4 border-b border-slate-800/90">
                    <div class="flex items-center gap-2">
                      <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-cyan-500/10 border border-cyan-500/30 text-cyan-400">
                        ${getCategorySVG(proj.category, 'w-4 h-4')}
                      </span>
                      <span class="font-mono-code text-xs font-semibold px-2.5 py-1 rounded bg-emerald-500/10 text-emerald-300 border border-emerald-500/30">
                        ${proj.categoryLabel}
                      </span>
                    </div>

                    ${
                      proj.isPlaceholder
                        ? `<span class="font-mono-code text-[11px] px-2.5 py-1 rounded bg-amber-500/10 text-amber-300 border border-amber-500/30">
                            Coming Soon — Template
                          </span>`
                        : `<span class="font-mono-code text-[11px] px-2.5 py-1 rounded bg-cyan-500/15 text-cyan-300 border border-cyan-400/40 flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Live Build
                          </span>`
                    }
                  </div>

                  <!-- Project Title & Description -->

      function renderActiveSample() {
        const filteredProjects =
          activeCategory === 'All'
            ? PORTFOLIO_PROJECTS
            : PORTFOLIO_PROJECTS.filter((p) => p.category === activeCategory);

        let html = '';
        if (activeSample === 'cyber') {
          html = renderCyberSample(filteredProjects);
        } else if (activeSample === 'bento') {
          html = renderBentoSample(filteredProjects);
        } else if (activeSample === 'brutalist') {
          html = renderBrutalistSample(filteredProjects);
        } else {
          html = renderCosmicSample(filteredProjects);
        }

        stageEl.innerHTML = html;

        /* Attach filter button listeners inside the active sample */
        const filterBtns = stageEl.querySelectorAll('.filter-btn');
        filterBtns.forEach((btn) => {
          btn.addEventListener('click', () => {
            activeCategory = btn.getAttribute('data-filter');
            renderActiveSample();
          });
        });
      }

        tabBtns.forEach((btn) => {
          const sampleKey = btn.getAttribute('data-sample');

            btn.className =
              'sample-tab-btn px-3 py-1.5 rounded-lg text-xs transition-all cursor-pointer bg-cyan-500 text-slate-950 font-semibold shadow-sm';

            btn.className =
              'sample-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all cursor-pointer bg-slate-900 text-slate-300 hover:bg-slate-800 hover:text-white border border-slate-800';

      function openCodeModal() {
        const meta = SAMPLE_META[activeSample];

        codeOutput.value = generateStandaloneHTML(activeSample);

        codeModal.classList.add('hidden');
        codeModal.classList.remove('flex');
      }

        codeOutput.focus();
        codeOutput.select();
        codeOutput.setSelectionRange(0, codeOutput.value.length);

        let copied = false;
        try {
          copied = document.execCommand('copy');
        } catch (err) {
          copied = false;
        }

        if (copied) {
          copyBtnText.textContent = 'Copied to Clipboard!';
          copyCodeBtn.classList.remove('bg-emerald-500', 'hover:bg-emerald-400');
          copyCodeBtn.classList.add('bg-cyan-400');
          setTimeout(() => {
            copyBtnText.textContent = 'Copy Code';
            copyCodeBtn.classList.remove('bg-cyan-400');
            copyCodeBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-400');
          }, 2200);
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(codeOutput.value).then(() => {
            copyBtnText.textContent = 'Copied to Clipboard!';
            setTimeout(() => {
              copyBtnText.textContent = 'Copy Code';
            }, 2200);
          });
        }
      }

      openModalBtn.addEventListener('click', openCodeModal);
      closeModalBtn.addEventListener('click', closeCodeModal);
      copyCodeBtn.addEventListener('click', copyStandaloneCode);

        if (e.target === codeModal) {
          closeCodeModal();
        }
      });

        if (e.key === 'Escape' && !codeModal.classList.contains('hidden')) {
